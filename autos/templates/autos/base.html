<!DOCTYPE html>
{% load static %}
<html lang="es-ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GYS Automotores — Compra y venta de autos usados y 0km{% endblock %}</title>

    <meta name="description" content="{% block meta_description %}Catálogo de autos usados y 0km de GYS Automotores. Consultá directo por WhatsApp o Instagram.{% endblock %}">

    <!-- Open Graph: vista previa al compartir por WhatsApp, Instagram, etc. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="GYS Automotores">
    <meta property="og:title" content="{% block og_title %}GYS Automotores{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Catálogo de autos usados y 0km. Consultá directo por WhatsApp o Instagram.{% endblock %}">
    <meta property="og:image" content="{% block og_image %}{{ request.scheme }}://{{ request.get_host }}{% static 'autos/img/mascota.png' %}{% endblock %}">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'autos/img/logo.png' %}">
    <link rel="stylesheet" href="{% static 'autos/style.css' %}">
</head>
<body>
    <header class="site-header">
        <a href="{% url 'catalogo' %}" class="marca">
            <span class="marca-placa">
                <img src="{% static 'autos/img/logo.png' %}" alt="GYS Automotores" class="marca-logo">
            </span>
        </a>
        <a href="https://instagram.com/{{ instagram_usuario }}" target="_blank" class="link-instagram">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
            Instagram
        </a>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <a href="https://wa.me/{{ whatsapp_numero }}?text=Hola!%20Quer%C3%ADa%20hacer%20una%20consulta"
       target="_blank" class="whatsapp-flotante" aria-label="Chatear por WhatsApp">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2zm5.8 14.05c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.81-.11-.42-.13-.95-.31-1.64-.6-2.88-1.24-4.76-4.14-4.9-4.33-.14-.19-1.17-1.56-1.17-2.97 0-1.41.74-2.1 1-2.39.26-.28.57-.35.76-.35.19 0 .38 0 .54.01.17.01.41-.06.64.49.24.57.81 1.98.88 2.12.07.14.12.31.02.5-.09.19-.14.31-.28.48-.14.16-.29.36-.42.49-.14.14-.28.29-.12.57.16.28.71 1.17 1.52 1.9 1.05.94 1.93 1.23 2.21 1.37.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.19-.28.37-.23.63-.14.26.09 1.66.78 1.94.93.28.14.47.21.54.33.07.12.07.68-.17 1.35z"/></svg>
    </a>


    <footer class="site-footer">
        <p>&copy; {% now "Y" %} GYS Automotores — Compra y venta de autos usados y 0km</p>
    </footer>
</body>
</html>
